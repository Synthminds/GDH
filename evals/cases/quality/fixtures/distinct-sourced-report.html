<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quality corpus: community report with sourced figures</title>
<style>
  /* Labelled eval page. A figure shows its source beside it. */
  :root { --ground: #fbfaf7; --ink: #191714; --muted: #5d574f; --mark: #2f6b4f;
          --text: "Literata", Georgia, serif; --head: "Archivo Narrow", "Arial Narrow", sans-serif; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--text); }
  article { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; }
  h1, h2 { font-family: var(--head); font-weight: 700; }
  figure { margin: 1.5rem 0; border-left: 0; }
  figcaption { color: var(--muted); font-size: 0.875rem; }
  .figure-value { font-family: var(--head); color: var(--mark); }
</style>
</head>
<body>
  <article>
    <h1>The allotments after one wet year</h1>
    <p>Most plots kept growing through the floods, but the lower terraces lost their beds twice.</p>
    <figure>
      <p class="figure-value">31 of 48 plots harvested in October</p>
      <figcaption>Source: allotment committee plot survey, October.</figcaption>
    </figure>
    <h2>What the committee will change</h2>
    <p>Raised beds on the lower terrace, and a shared drain along the east path.</p>
  </article>
</body>
</html>
