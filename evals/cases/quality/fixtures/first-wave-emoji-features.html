<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quality corpus: first-wave page with emoji icons</title>
<style>
  body { margin: 0; font-family: Roboto, Arial, sans-serif; background: #ffffff; color: #111827; }
  .hero { text-align: center; padding: 96px 24px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; padding: 48px 24px; }
  .card { border-radius: 16px; padding: 24px; border-left: 4px solid #6366f1; background: #f9fafb; }
  .icon { font-size: 32px; }
</style>
</head>
<body>
  <section class="hero">
    <h1>Your AI copilot for everything</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
  </section>
  <section class="cards">
    <div class="card"><span class="icon">🚀</span><h3>Launch faster</h3><p>Get started in seconds.</p></div>
    <div class="card"><span class="icon">🔒</span><h3>Stay secure</h3><p>Your data is safe with us.</p></div>
    <div class="card"><span class="icon">⚡</span><h3>Work smarter</h3><p>Automate the boring parts.</p></div>
  </section>
  <section><p>"It changed how our team works." John Smith, CEO at Example Inc</p></section>
</body>
</html>
