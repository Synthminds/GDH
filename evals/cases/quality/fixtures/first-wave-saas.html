<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quality corpus: first-wave generic SaaS page</title>
<style>
  /* Labelled eval page. It holds first-wave habits on purpose. */
  body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #0a0a12; color: #ededf7; }
  .hero { text-align: center; padding: 120px 24px; background: linear-gradient(120deg, #6d28d9, #2563eb); }
  h1 { font-size: 72px; background: linear-gradient(90deg, #c084fc, #38bdf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; padding: 80px 24px; }
  .feature { border-radius: 20px; padding: 32px; background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); box-shadow: 0 0 48px rgba(124, 58, 237, 0.5); }
  .nav, .footer, .modal { border-radius: 20px; backdrop-filter: blur(12px); }
</style>
</head>
<body>
  <nav class="nav">Nimbus</nav>
  <section class="hero">
    <h1>Unlock the power of your data</h1>
    <p>The all-in-one platform for modern teams.</p>
  </section>
  <section class="features">
    <div class="feature"><h3>Lightning fast</h3><p>Ship in minutes, not months.</p></div>
    <div class="feature"><h3>Rock-solid security</h3><p>Enterprise-grade from day one.</p></div>
    <div class="feature"><h3>Infinitely scalable</h3><p>Grow without limits.</p></div>
  </section>
  <footer class="footer">Made with care.</footer>
</body>
</html>
