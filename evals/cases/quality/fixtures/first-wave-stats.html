<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quality corpus: first-wave stat band</title>
<style>
  body { margin: 0; font-family: Inter, sans-serif; background: #09090b; color: #fafafa; }
  .eyebrow { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #a78bfa; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; padding: 64px 24px; }
  .num { font-size: 60px; font-weight: 800; background: linear-gradient(90deg, #f472b6, #818cf8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .label { font-size: 13px; color: #a1a1aa; }
</style>
</head>
<body>
  <section><p class="eyebrow">Why us</p><h2>Numbers that speak</h2></section>
  <section class="stats">
    <div><div class="num">10x</div><div class="label">faster builds</div></div>
    <div><div class="num">99.99%</div><div class="label">uptime</div></div>
    <div><div class="num">2M+</div><div class="label">users</div></div>
    <div><div class="num">150+</div><div class="label">countries</div></div>
  </section>
  <section><p class="eyebrow">Pricing</p><h2>Simple plans</h2></section>
  <section><p class="eyebrow">FAQ</p><h2>Questions</h2></section>
</body>
</html>
