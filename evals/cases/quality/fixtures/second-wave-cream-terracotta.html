<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quality corpus: second-wave editorial template</title>
<style>
  /* Labelled eval page. Cream ground, terracotta accent, serif display, small caps labels, stat row. */
  body { margin: 0; font-family: "Inter", sans-serif; background: #f5f1e8; color: #1f1b16; }
  h1, h2 { font-family: "Fraunces", Georgia, serif; font-weight: 400; }
  h1 { font-size: 80px; letter-spacing: -0.03em; }
  .kicker { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #b4532a; }
  .btn { background: #b4532a; color: #fff; border-radius: 999px; padding: 12px 24px; }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); padding: 48px 24px; }
  .metric strong { font-size: 56px; font-family: "Fraunces", Georgia, serif; }
  .metric span { font-size: 13px; color: #6b6259; }
</style>
</head>
<body>
  <section><p class="kicker">Studio</p><h1>Thoughtfully crafted, quietly confident.</h1><a class="btn" href="#">Book a call</a></section>
  <section class="metrics">
    <div class="metric"><strong>120</strong><span>brands launched</span></div>
    <div class="metric"><strong>14</strong><span>years of practice</span></div>
    <div class="metric"><strong>98%</strong><span>client retention</span></div>
  </section>
  <section><p class="kicker">Approach</p><h2>Slow design for fast companies</h2></section>
  <section><p class="kicker">Work</p><h2>Selected projects</h2></section>
</body>
</html>
