<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quality corpus: second-wave dark template</title>
<style>
  /* Labelled eval page. Tinted near-black, one orange accent, mono labels, bento grid. */
  body { margin: 0; font-family: "Geist", system-ui, sans-serif; background: #0e0f11; color: #e7e7e4; }
  .label { font-family: "Geist Mono", monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: #ff6a1a; }
  .bento { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; padding: 24px; }
  .tile { border: 1px solid #26282c; border-radius: 12px; padding: 24px; background: #141518; }
  .cta { background: #ff6a1a; color: #0e0f11; border-radius: 8px; padding: 10px 18px; }
</style>
</head>
<body>
  <section><p class="label">[ 01 ] Platform</p><h1>Infrastructure for the agentic era.</h1><a class="cta" href="#">Start building</a></section>
  <section class="bento">
    <div class="tile"><p class="label">Observability</p><h3>See every run</h3></div>
    <div class="tile"><p class="label">Evals</p><h3>Measure what matters</h3></div>
    <div class="tile"><p class="label">Deploy</p><h3>One command</h3></div>
    <div class="tile"><p class="label">Scale</p><h3>Built for production</h3></div>
  </section>
</body>
</html>
