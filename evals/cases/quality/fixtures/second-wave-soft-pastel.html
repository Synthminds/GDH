<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quality corpus: second-wave pastel template</title>
<style>
  body { margin: 0; font-family: "Plus Jakarta Sans", sans-serif; background: #fbf8ff; color: #1d1b26; }
  .hero { text-align: center; padding: 96px 24px; background: radial-gradient(circle at 30% 20%, #e9d5ff, transparent 60%), radial-gradient(circle at 70% 60%, #bfdbfe, transparent 60%); }
  .pill { display: inline-block; border-radius: 999px; padding: 4px 12px; background: #ede9fe; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 48px 24px; }
  .card { border-radius: 28px; padding: 28px; background: #ffffff; box-shadow: 0 0 60px rgba(167, 139, 250, 0.35); }
  button, input, .nav { border-radius: 28px; }
</style>
</head>
<body>
  <nav class="nav">Lumen</nav>
  <section class="hero"><span class="pill">New</span><h1>Meet your new favorite workspace</h1><button>Join the waitlist</button></section>
  <section class="grid">
    <div class="card"><h3>Capture</h3><p>Everything in one place.</p></div>
    <div class="card"><h3>Connect</h3><p>Your tools, together.</p></div>
    <div class="card"><h3>Create</h3><p>Ideas into action.</p></div>
  </section>
</body>
</html>
